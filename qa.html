<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive QA</title><style>html,body{margin:0;background:#ececec}iframe{display:block;border:0;background:white}</style></head><body><iframe title="Responsive case study" id="preview"></iframe><script>
const query = new URLSearchParams(location.search);
const frame = document.getElementById('preview');
const width = Math.max(320, Math.min(1920, Number(query.get('width')) || 390));
const height = Math.max(320, Math.min(1200, Number(query.get('height')) || 700));
frame.width = width; frame.height = height;
frame.src = '/'+(query.get('lang') === 'en' ? '?lang=en' : '')+'#/'+(query.get('route') === 'design-system' ? 'design-system' : 'satellite-sos');
</script></body></html>
